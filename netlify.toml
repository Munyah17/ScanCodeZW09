[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "api"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# ── Local dev (netlify dev) port lock ──────────────────────────────────────
# ScanCodeZW is assigned: Frontend=4184, Functions/API server=3004
[dev]
  framework    = "vite"
  command      = "npm run dev"
  targetPort   = 5402   # ScanCodeZW Vite frontend — dedicated, do not reuse
  port         = 3042   # ScanCodeZW API server — dedicated, do not reuse
  autoLaunch   = false

# ── Cache control ─────────────────────────────────────────────────────────────
# index.html: never cache — browser must always fetch the latest entry point
# so it picks up new hashed asset filenames after every deploy
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"

# Vite hashes JS/CSS filenames on every build (e.g. index-DME9Lwkw.js)
# A changed file always gets a new URL, so caching forever is safe
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API responses must never be cached
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# SPA fallback — Netlify Functions v2 (config.path) handle /api/* directly; no redirect needed
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
